name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action-metadata:
    name: action.yml metadata (Marketplace limits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: name, description (max 125 characters) and branding are present and valid
        run: |
          python3 - <<'PY'
          import re
          t = open("action.yml", encoding="utf-8").read()
          name = re.search(r"^name:\s*(.+)$", t, re.M).group(1).strip().strip('"')
          desc = re.search(r"^description:\s*(.+)$", t, re.M).group(1).strip().strip('"')
          icon = re.search(r"^  icon:\s*(\S+)", t, re.M)
          color = re.search(r"^  color:\s*(\S+)", t, re.M)
          assert name, "name missing"
          assert 0 < len(desc) <= 125, f"description is {len(desc)} characters; the Marketplace allows at most 125"
          assert icon and color, "branding icon and color are required"
          assert color.group(1) in {"white", "black", "yellow", "blue", "green", "orange", "red", "purple", "gray-dark"}, color.group(1)
          print(f"ok: {name!r}, description {len(desc)} characters, icon {icon.group(1)}, color {color.group(1)}")
          PY
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install .
      - run: python -m pytest -q
      - name: Installed CLI runs
        run: |
          agp9-ready --version
          agp9-ready --list-rules

  oracle:
    # Every construct in tests/oracle/run_oracle.py is built with a real Android Gradle Plugin; the build outcome must agree with what agp9-ready reports.
    name: oracle (real AGP ${{ matrix.agp }}, Gradle 9.8.0)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agp: ["9.4.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle 9.8.0 (checksum pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-9.8.0-bin.zip"
          echo "bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.8.0/bin" >> "$GITHUB_PATH"
      - name: agp9-ready agrees with AGP ${{ matrix.agp }}
        run: python tests/oracle/run_oracle.py --agp ${{ matrix.agp }}

  action:
    name: action (this checkout, fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clean fixture passes
        uses: ./
        with:
          path: tests/fixtures/clean-app
          fail-on: warning
          sarif-file: ${{ runner.temp }}/agp9.sarif
      - name: Legacy fixture fails
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/legacy-app
      - name: It really failed
        run: test "${{ steps.bad.outcome }}" = "failure"
      - name: SARIF was written
        run: python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['version']=='2.1.0'" "$RUNNER_TEMP/agp9.sarif"

  package:
    name: build wheel and sdist, install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/agp9-ready tests/fixtures/clean-app

  dependabot-gaps:
    name: dependabot-gaps (released action, consumer test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cosmichackerx/dependabot-gaps@v0.2.1
        with:
          fail-on: warning
          pr-mode: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

  released-action:
    name: released action (consumer test, v0.2.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: PR mode with the published tag (legacy fixture is old, so nothing is new)
        if: github.event_name == 'pull_request'
        uses: cosmichackerx/agp9-ready@v0.2.1
        with:
          path: tests/fixtures/legacy-app
          pr-mode: "true"
          fail-on: warning
      - name: Clean fixture passes with the published tag
        uses: cosmichackerx/agp9-ready@v0.2.1
        with:
          path: tests/fixtures/clean-app
      - name: Legacy fixture fails with the published tag
        id: bad
        continue-on-error: true
        uses: cosmichackerx/agp9-ready@v0.2.1
        with:
          path: tests/fixtures/legacy-app
      - name: It really failed
        run: test "${{ steps.bad.outcome }}" = "failure"
      - name: Remote pre-commit hook at the published tag (clean fixture passes)
        run: |
          pip install pre-commit
          work="$RUNNER_TEMP/pcr"; rm -rf "$work"; mkdir -p "$work"
          cp -r tests/fixtures/clean-app/. "$work/"
          cd "$work" && git init -q && git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -q -m fixture
          pre-commit try-repo https://github.com/cosmichackerx/agp9-ready agp9-ready --ref v0.2.1 --all-files

  pre-commit:
    name: pre-commit hook (try-repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pre-commit
      - name: Hook passes on the clean fixture, fails on the legacy one, and the fix hook rewrites it
        run: |
          work="$RUNNER_TEMP/pc"
          rm -rf "$work"; mkdir -p "$work/clean" "$work/legacy"
          cp -r tests/fixtures/clean-app/. "$work/clean/"
          cp -r tests/fixtures/legacy-app/. "$work/legacy/"
          for d in clean legacy; do
            (cd "$work/$d" && git init -q && git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -q -m fixture)
          done
          (cd "$work/clean" && pre-commit try-repo "$GITHUB_WORKSPACE" agp9-ready --all-files)
          if (cd "$work/legacy" && pre-commit try-repo "$GITHUB_WORKSPACE" agp9-ready --all-files); then echo "the hook should fail on the legacy fixture"; exit 1; fi
          (cd "$work/legacy" && pre-commit try-repo "$GITHUB_WORKSPACE" agp9-ready-fix --all-files) || true
          if (cd "$work/legacy" && git diff --quiet); then echo "the fix hook changed nothing"; exit 1; fi

  comment-selftest:
    name: PR mode and sticky comment (same-repo pull requests)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: First run creates the comment
        uses: ./
        with:
          path: tests/fixtures/legacy-app
          pr-mode: "true"
          comment: "true"
          fail-on: never
      - name: Second run updates the same comment
        uses: ./
        with:
          path: tests/fixtures/legacy-app
          pr-mode: "true"
          comment: "true"
          fail-on: never
      - name: Exactly one sticky comment exists, and it is a PR mode report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments"
          n="$(gh api "$url" --paginate --jq '[.[] | select(.body | startswith("<!-- agp9-ready:sticky -->"))] | length' | awk '{s+=$1} END{print s+0}')"
          m="$(gh api "$url" --paginate --jq '[.[] | select((.body | startswith("<!-- agp9-ready:sticky -->")) and (.body | contains("introduced since")))] | length' | awk '{s+=$1} END{print s+0}')"
          echo "sticky comments: $n, PR-mode ones: $m"
          test "$n" = "1" && test "$m" = "1"
